# Stack de SUBMISSÃO (vai na raiz da branch `submission`).
# Usa a imagem pública do GHCR (auto-contida, com o índice embutido) — sem volume externo.
# Limites somam exatamente 1.0 CPU e 350 MB (nginx 10 + api 170 + api 170).
name: rinha-2026

services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 10M

  api-1:
    image: ghcr.io/iv4nlanna/rinha-fraud:latest
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DATA_PATH=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: 170M

  api-2:
    image: ghcr.io/iv4nlanna/rinha-fraud:latest
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DATA_PATH=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: 170M
