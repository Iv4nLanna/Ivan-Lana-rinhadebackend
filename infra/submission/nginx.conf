worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server api-1:8080;
        server api-2:8080;
    }

    server {
        listen 9999;

        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
