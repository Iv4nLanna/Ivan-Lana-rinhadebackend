name: rinha-2026

services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 10M

  api-1:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DATA_PATH=/app/data
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: 175M

  api-2:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DATA_PATH=/app/data
    volumes:
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: 175M
